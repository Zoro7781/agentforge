name: Verify AgentForge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npx tsc lib/generator.ts lib/templates.ts --module commonjs --target es2021 --skipLibCheck --outDir /tmp/agentforge-compiler
      - run: node tests/verify-templates.mjs /tmp/agentforge-compiler /tmp/agentforge-templates
      - run: pip install -r templates/crud/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: |
          for template in inventory crm booking projects; do
            (cd /tmp/agentforge-templates/$template && python -m pytest -q test_app.py)
          done
      - run: npm run build

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__APP_TITLE__</title><style>body{font:16px system-ui;margin:0;background:#f1f5f3;color:#18382b}header{background:#173e2d;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:25px}button,input,textarea,select{font:inherit;padding:10px;border:1px solid #b9cec2;border-radius:6px;margin:4px}button{cursor:pointer;background:#216448;color:white}nav{margin:20px 0}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:15px;border-bottom:1px solid #dde5df}#message{color:#9b2525}form{display:flex;flex-wrap:wrap;align-items:center;background:white;padding:14px;margin:20px 0}label{display:flex;flex-direction:column;font-size:14px}small{color:#5a7162}.scroll{overflow:auto}@media(max-width:650px){main{padding:14px}form{display:block}input,textarea{max-width:90%}}</style><header><h1>__APP_TITLE__</h1><p>Your CRUD workspace</p></header><main><section id="login"><label>Application key<input id="key" type="password" autocomplete="off"></label><button id="connect">Connect</button><p>Your key is kept in memory for this session.</p></section><section id="app" hidden><nav id="collections"></nav><input id="search" aria-label="Search records" placeholder="Search records"><button id="refresh">Search</button><form id="form"><input id="editId" type="hidden"><label>Name<input id="name" required maxlength="160"></label><label>Description<textarea id="description" maxlength="4000"></textarea></label><label>Status<select id="status"><option>active</option><option>inactive</option><option>archived</option></select></label><button type="submit">Save record</button><button type="button" id="cancel">Clear</button></form><div class="scroll"><table><thead><tr><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>No records found. Add your first record above.</p><p><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></p></section><p id="message" role="status"></p><small>Generated CRUD foundation. Shared-key access; configure user authentication and tenant roles before external production use.</small></main><script>
let token='',collection='',offset=0;const el=id=>document.getElementById(id);const notice=s=>el('message').textContent=s;async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'X-API-Key':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error(r.status===401?'Invalid application key.':'Request failed ('+r.status+').');return r.status===204?null:r.json()}
async function load(){notice('Loading…');try{const rows=await api('/api/'+collection+'?q='+encodeURIComponent(el('search').value)+'&limit=25&offset='+offset);el('rows').replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const k of ['name','description','status']){const td=document.createElement('td');td.textContent=row[k];tr.append(td)}const td=document.createElement('td');for(const label of ['Edit','Delete']){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(label==='Edit'){el('editId').value=row.id;for(const k of ['name','description','status'])el(k).value=row[k]}else if(confirm('Delete this record?')){try{await api('/api/'+collection+'/'+row.id,'DELETE');await load()}catch(e){notice(e.message)}}};td.append(b)}tr.append(td);el('rows').append(tr)}el('empty').hidden=rows.length>0;el('page').textContent=' Page '+(offset/25+1)+' ';el('previous').disabled=offset===0;el('next').disabled=rows.length<25;notice('')}catch(e){notice(e.message)}}
el('connect').onclick=async()=>{token=el('key').value;try{const list=await api('/api/collections');el('key').value='';el('collections').replaceChildren();for(const c of list){const b=document.createElement('button');b.textContent=c;b.onclick=()=>{collection=c;offset=0;el('form').reset();load()};el('collections').append(b)}collection=list[0];el('login').hidden=true;el('app').hidden=false;await load()}catch(e){notice(e.message)}};el('form').onsubmit=async e=>{e.preventDefault();try{const id=el('editId').value;await api('/api/'+collection+(id?'/'+id:''),id?'PUT':'POST',Object.fromEntries(['name','description','status'].map(k=>[k,el(k).value])));el('form').reset();await load()}catch(e){notice(e.message)}};el('cancel').onclick=()=>el('form').reset();el('refresh').onclick=()=>{offset=0;load()};el('previous').onclick=()=>{offset=Math.max(0,offset-25);load()};el('next').onclick=()=>{offset+=25;load()};
</script></html>
